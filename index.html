<style>

*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--wall);background-size:cover;background-attachment:fixed;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.glass,.card{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 16px 50px #0002}.app{max-width:1450px;margin:auto;padding:12px 13px 100px}.top{position:sticky;top:7px;z-index:20;display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:18px}.brand{display:flex;gap:8px;align-items:center;border:0;background:transparent;font-size:20px;font-weight:850;letter-spacing:-1px;white-space:nowrap}.logo{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#53d9c5);color:white}.tabs{display:flex;gap:5px;flex:1;overflow:auto;scrollbar-width:none}.tab,.btn,.iconbtn,.navbtn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px}.tab{border-color:transparent;background:transparent;color:var(--muted);white-space:nowrap;max-width:170px}.tab.active{background:var(--panel2);color:var(--text);border-color:var(--line)}.tab span:first-child{overflow:hidden;text-overflow:ellipsis}.iconbtn{width:40px;height:40px;padding:0;font-size:18px;flex-shrink:0}.btn.primary{background:var(--accent);border-color:transparent;color:white;font-weight:700}.btn:hover,.iconbtn:hover,.tile:hover{filter:brightness(1.12);transform:translateY(-1px)}.toolbar{display:flex;gap:7px;align-items:center;margin:12px 0;padding:8px;border-radius:17px}.address{display:flex;align-items:center;gap:8px;flex:1;min-width:0;border:1px solid var(--line);background:#05071260;border-radius:13px;padding:0 10px;min-height:42px}.address input{width:100%;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:16px}.muted{color:var(--muted)}.hidden{display:none!important}.view{animation:fade .22s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.hero{text-align:center;padding:clamp(30px,6vw,70px) 4px 25px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:#67e3d1}.clock{font-size:clamp(44px,9vw,78px);font-weight:800;letter-spacing:-4px;margin:10px 0 5px;font-variant-numeric:tabular-nums}.greeting{font-size:clamp(23px,4vw,33px);font-weight:760;letter-spacing:-1px;margin:25px 0 7px}.searchbox{display:flex;gap:8px;max-width:690px;margin:24px auto 0;padding:8px;border-radius:19px}.searchbox input{flex:1;min-width:0;padding:0 12px;background:transparent;border:0;outline:0;color:var(--text);font-size:16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 2px 12px}.section-head h2{margin:0;font-size:17px}.section-head p{margin:5px 0 0;font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{border-radius:20px;padding:15px;min-width:0}.tile{display:flex;flex-direction:column;gap:10px;min-height:120px;text-align:left;transition:.16s}.siteicon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--panel2);font-size:21px}.tile strong{font-size:14px}.tile small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}.widgetgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.widget h3{font-size:12px;color:var(--muted);margin:0 0 12px}.widget.wide{grid-column:span 2}.value{font-size:24px;font-weight:760}.widget p{font-size:13px;color:var(--muted);line-height:1.5}.dockwrap{position:fixed;z-index:30;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 18px)}.dock{display:flex;gap:5px;align-items:center;padding:7px;border-radius:22px;background:#161827c9;border:1px solid #ffffff28;backdrop-filter:blur(28px);box-shadow:0 16px 45px #0007}.dock button{position:relative;min-width:46px;height:47px;border-radius:15px;background:transparent;border:1px solid transparent;padding:0 10px;font-size:20px}.dock button.active{background:color-mix(in srgb,var(--accent) 30%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}.dock small{font-size:11px;margin-left:5px}.dock .dot{position:absolute;bottom:3px;left:calc(50% - 2px);width:4px;height:4px;background:#65e2cf;border-radius:50%}.pageview{height:calc(100dvh - 175px);min-height:340px;border-radius:20px;overflow:auto;background:#f5f7ff;color:#202438;display:grid;place-items:center;padding:25px;text-align:center}.pageview h2{margin:8px}.pageview p{line-height:1.6;color:#667086;max-width:430px}.settingslayout{display:grid;grid-template-columns:210px 1fr;gap:14px}.sidenav{display:flex;flex-direction:column;gap:5px;align-self:start;position:sticky;top:90px}.navbtn{justify-content:flex-start;background:transparent;border-color:transparent;color:var(--muted);text-align:left}.navbtn.active{background:var(--panel2);color:var(--text);border-color:var(--line)}.group{margin-bottom:13px}.group h3{margin:0 0 7px;font-size:16px}.group>p{font-size:13px;color:var(--muted);line-height:1.5}.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.setting strong{font-size:14px;display:block}.setting small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:4px}.setting select,.field,.notearea{background:#080a14a8;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px;max-width:160px}.switch{width:44px;height:26px;border:0;border-radius:99px;background:#555b6c;position:relative;flex-shrink:0}.switch:after{content:"";position:absolute;width:20px;height:20px;top:3px;left:3px;border-radius:50%;background:white;transition:.18s}.switch.on{background:var(--accent)}.switch.on:after{transform:translateX(18px)}.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.wall{height:74px;border:2px solid transparent;border-radius:13px}.wall.sel{border-color:var(--accent)}.w1{background:radial-gradient(at 20% 20%,#765be6,transparent 60%),linear-gradient(130deg,#14182f,#0c5a68)}.w2{background:radial-gradient(at 80% 15%,#ffad82,transparent 50%),linear-gradient(135deg,#653c79,#171b40)}.w3{background:radial-gradient(at 25% 80%,#7fe7c2,transparent 55%),linear-gradient(140deg,#142f37,#172039)}.w4{background:linear-gradient(135deg,#e3d5ff,#9bb9f5)}.w5{background:linear-gradient(140deg,#10131c,#3b4154)}.w6{background:radial-gradient(at 50% 50%,#ffca75,transparent 50%),linear-gradient(130deg,#593c56,#151c37)}.notegrid,.gamegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.notearea{max-width:none;width:100%;min-height:130px;resize:vertical;line-height:1.5}.note-title{width:100%;background:transparent;color:var(--text);border:0;border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:8px;font-weight:700}.game{display:flex;flex-direction:column;gap:10px;min-height:190px}.game .emoji{font-size:34px}.game p{font-size:13px;color:var(--muted);line-height:1.5;flex:1}.status{padding:12px;border:1px solid var(--line);background:var(--panel2);border-radius:13px;color:var(--muted);font-size:13px;line-height:1.5}.empty{text-align:center;color:var(--muted);padding:35px}.footnote{font-size:12px;color:var(--muted);line-height:1.6;margin-top:20px}.toastwrap{position:fixed;z-index:80;right:12px;top:80px;display:grid;gap:7px;max-width:calc(100vw - 24px)}.toast{background:#202437f5;border:1px solid var(--line);border-radius:13px;padding:12px 15px;box-shadow:0 12px 30px #0005;font-size:13px}.modalroot:empty{display:none}.modalroot{position:fixed;inset:0;z-index:70;background:#03040bb0;display:grid;place-items:center;padding:15px}.modal{width:min(500px,100%);padding:22px;border-radius:22px}.modal p{color:var(--muted);font-size:14px;line-height:1.6}.actions{display:flex;justify-content:flex-end;gap:8px}.file{display:none}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.settingslayout{grid-template-columns:1fr}.sidenav{position:static;flex-direction:row;overflow:auto}.navbtn{white-space:nowrap}.brand .word{display:none}}

</style></head><body>
<div class="app"><header class="top glass"><button class="brand" id="brand"><span class="logo">B</span><span class="word">BrowIO</span></button><div class="tabs" id="tabs"></div><button class="iconbtn" id="newtab" title="New tab">＋</button><button class="iconbtn" id="topsettings" title="Settings">⚙</button></header>
<div class="toolbar glass" id="toolbar"><button class="iconbtn" id="back" title="Back">←</button><button class="iconbtn" id="forward" title="Forward">→</button><button class="iconbtn" id="reload" title="Reload">↻</button><div class="address"><span>⌕</span><input id="address" placeholder="Search or enter a website" inputmode="url" autocomplete="off" autocapitalize="off"><button class="iconbtn" id="go">➜</button></div><button class="iconbtn optional" id="bookmark" title="Bookmark">☆</button><button class="iconbtn optional" id="home" title="Home">⌂</button></div><main id="main" class="view"></main></div>
<div class="dockwrap"><nav class="dock" id="dock"></nav></div><div class="toastwrap" id="toasts" aria-live="polite"></div><div class="modalroot" id="modalroot"></div><input class="file" id="wallfile" type="file" accept="image/*"><input class="file" id="importfile" type="file" accept=".browio,.json,application/json">
<script>
(function(){
const $=id=>document.getElementById(id),KEY="browio_state_v1";
const defaults={version:1,theme:"dark",accent:"#8175ff",wall:"w1",customWall:"",transparency:78,dockSize:"standard",search:"google",greeting:true,clock24:false,reducedMotion:false,widgets:{clock:true,weather:true,notes:true,recent:true,favorites:true},favorites:[{title:"Wikipedia",url:"https://www.wikipedia.org",icon:"📚"},{title:"YouTube",url:"https://www.youtube.com",icon:"▶️"},{title:"GitHub",url:"https://github.com",icon:"🐙"},{title:"Google",url:"https://www.google.com",icon:"🔎"}],bookmarks:[],history:[],notes:[{id:"welcome",title:"Welcome to BrowIO",body:"Your ideas live here. Customize your space and make BrowIO yours."}],workspaces:[{id:"personal",name:"Personal"},{id:"school",name:"School"},{id:"gaming",name:"Gaming"}],activeWorkspace:"personal",games:{coins:0,taps:0,mathHigh:0},downloads:[],lastSaved:Date.now()};
function load(){try{return Object.assign(JSON.parse(JSON.stringify(defaults)),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return JSON.parse(JSON.stringify(defaults))}}
let s=load(),tabs=[],tid=0,active=0,privateMode=false,tempHistory=[],settingTab="appearance",target=0,attempts=0,mathA=0,mathB=0,mathScore=0;
const engines={google:"https://www.google.com/search?q=",bing:"https://www.bing.com/search?q=",duckduckgo:"https://duckduckgo.com/?q="};
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){try{s.lastSaved=Date.now();localStorage.setItem(KEY,JSON.stringify(s));return true}catch(e){toast("Save failed. Device storage may be full.");return false}}
function toast(msg){let e=document.createElement("div");e.className="toast";e.textContent=msg;$("toasts").append(e);setTimeout(()=>e.remove(),3200)}
function urlFor(v){v=String(v||"").trim();if(!v)return "";if(/^(javascript|data|vbscript):/i.test(v))return "";if(/^https?:\/\//i.test(v))return v;if(/^[\w.-]+\.[a-z]{2,}([/:?#]|$)/i.test(v)&&!/\s/.test(v))return "https://"+v;return engines[s.search]+encodeURIComponent(v)}
function current(){return tabs.find(t=>t.id===active)}
function makeTab(url){let t={id:++tid,title:"New tab",url:"",hist:[],idx:-1,home:true};tabs.push(t);active=t.id;drawTabs();if(url)nav(url);else homeView();return t}
function drawTabs(){$("tabs").innerHTML="";tabs.forEach(t=>{let b=document.createElement("button");b.className="tab"+(t.id===active?" active":"");b.innerHTML="<span>"+esc(t.title)+"</span><span data-close='"+t.id+"'>×</span>";b.addEventListener("click",e=>{if(e.target.dataset.close){closeTab(t.id);return}active=t.id;drawTabs();sync();t.home?homeView():pageView(t.url)});$("tabs").append(b)});$("back").disabled=!(current()&&current().idx>0);$("forward").disabled=!(current()&&current().idx<current().hist.length-1)}
function sync(){$("address").value=current()?.url||"";drawTabs()}
function closeTab(id){if(tabs.length===1){tabs[0].title="New tab";tabs[0].url="";tabs[0].home=true;tabs[0].hist=[];tabs[0].idx=-1;active=tabs[0].id;homeView();drawTabs();sync();return}let i=tabs.findIndex(t=>t.id===id);tabs=tabs.filter(t=>t.id!==id);if(active===id)active=tabs[Math.max(0,i-1)].id;drawTabs();sync();current().home?homeView():pageView(current().url)}
function nav(raw,skip){let u=urlFor(raw);if(!u){toast("Enter a website or search phrase.");return}let t=current();t.url=u;t.home=false;t.title=title(u);if(!skip){t.hist=t.hist.slice(0,t.idx+1);t.hist.push(u);t.idx=t.hist.length-1}let entry={title:t.title,url:u,time:Date.now()};if(privateMode)tempHistory.unshift(entry);else{s.history.unshift(entry);s.history=s.history.slice(0,400);save()}sync();pageView(u)}
function title(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return "Website"}}
function pageView(u){$("toolbar").classList.remove("hidden");$("main").innerHTML='<section class="pageview"><div><div style="font-size:46px">🌐</div><h2>Open '+esc(title(u))+'</h2><p>BrowIO will try to show websites in its own viewing area, but some sites block embedded viewing for security reasons.</p><button class="btn primary" id="external">Open in browser ↗</button><p class="muted" style="font-size:12px;word-break:break-word">'+esc(u)+'</p><div class="status">If this page cannot be embedded, open it in a normal browser tab. BrowIO cannot bypass a site's embedding restrictions.</div></div></section>';$("external").onclick=()=>window.open(u,"_blank","noopener,noreferrer");current().title=title(u);drawTabs();sync();dock()}
function time(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:!s.clock24})}
function date(){return new Date().toLocaleDateString([],{weekday:"long",month:"long",day:"numeric",year:"numeric"})}
function greet(){let h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening"}
function homeView(){s.active="home";save();$("toolbar").classList.remove("hidden");$("main").innerHTML='<section class="hero"><div class="eyebrow">YOUR SPACE ON THE WEB</div><div class="clock" id="clock">'+time()+'</div><div class="muted" id="date">'+date()+'</div><div class="greeting">'+(s.greeting?greet()+". Ready to explore?":"What will you discover today?")+'</div><p class="muted">One search away from anywhere.</p><form class="searchbox glass" id="searchform"><span style="font-size:21px;padding:0 7px">⌕</span><input id="searchinput" placeholder="Search the web or enter a website…" autocomplete="off"><button class="btn primary">Search ↗</button></form></section><section class="'+(s.widgets.favorites?"":"hidden")+'"><div class="section-head"><div><h2>Quick launch</h2><p>Your favorite places, one tap away</p></div><button class="btn" id="addfav">＋ Add shortcut</button></div><div class="grid" id="favgrid"></div></section><section><div class="section-head"><div><h2>Your widgets</h2><p>A little dashboard, made yours</p></div><button class="btn" id="widgetsettings">Customize</button></div><div class="widgetgrid" id="widgetgrid"></div></section><p class="footnote">Your BrowIO preferences and saved notes live in this browser on this device. Export a backup to keep a separate copy.</p>';$("searchform").onsubmit=e=>{e.preventDefault();if(current().url)makeTab();nav($("searchinput").value)};$("addfav").onclick=addFav;$("widgetsettings").onclick=()=>settings("widgets");drawFavs();drawWidgets();dock()}
function drawFavs(){let g=$("favgrid");if(!g)return;g.innerHTML="";s.favorites.forEach((f,i)=>{let b=document.createElement("button");b.className="card tile";b.innerHTML='<span class="siteicon">'+esc(f.icon||"🌐")+'</span><strong>'+esc(f.title)+'</strong><small>'+esc(f.url)+'</small>';b.onclick=()=>nav(f.url);b.oncontextmenu=e=>{e.preventDefault();if(confirm("Remove "+f.title+"?")){s.favorites.splice(i,1);save();drawFavs()}};g.append(b)});if(!s.favorites.length)g.innerHTML='<div class="empty">Add a shortcut to get started.</div>'}
function addFav(){let name=prompt("Shortcut name:");if(!name)return;let raw=prompt("Website URL:","https://");if(!raw)return;let u=urlFor(raw);if(!/^https?:/i.test(u)){toast("Please enter a valid website URL.");return}s.favorites.push({title:name.slice(0,45),url:u,icon:"🌐"});save();drawFavs();toast("Shortcut added.")}
function drawWidgets(){let g=$("widgetgrid");if(!g)return;g.innerHTML="";function add(id,html,wide){if(!s.widgets[id])return;let e=document.createElement("article");e.className="card widget"+(wide?" wide":"");e.innerHTML=html;g.append(e)}add("clock",'<h3>TIME & DATE</h3><div class="value">'+time()+'</div><p>'+date()+'</p>');add("weather",'<h3>WEATHER</h3><div class="value">☁️ Forecast</div><p>Find a live forecast from your search provider.</p><button class="btn" data-weather>Search weather ↗</button>');add("notes",'<h3>QUICK NOTES</h3><div class="value">✎ '+s.notes.length+' saved</div><p>Keep ideas and reminders close.</p><button class="btn" data-notes>Open notes</button>');add("recent",'<h3>RECENTLY VISITED</h3>'+(s.history.slice(0,3).map(h=>'<p>🌐 '+esc(h.title)+' <span class="muted">· '+new Date(h.time).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+'</span></p>').join("")||'<p>No recent pages yet.</p>'),true);g.querySelectorAll("[data-weather]").forEach(b=>b.onclick=()=>nav("weather near me"));g.querySelectorAll("[data-notes]").forEach(b=>b.onclick=()=>open("notes"))}
function dock(){let d=$("dock");if(!d)return;let items=[["home","⌂","Home"],["bookmarks","☆","Bookmarks"],["workspaces","▦","Spaces"],["notes","✎","Notes"],["games","🎮","Games"],["downloads","⇩","Files"],["settings","⚙","Settings"]];d.innerHTML="";items.forEach(([id,ic,label])=>{let b=document.createElement("button");b.className=(s.active===id?"active":"");b.innerHTML=ic+'<small>'+label+'</small>'+(s.active===id?'<span class="dot"></span>':"");b.title=label;b.onclick=()=>open(id);d.append(b)});d.style.background="rgba(20,22,35,"+(s.transparency/100)+")";d.querySelectorAll("button").forEach(b=>{b.style.minWidth=s.dockSize==="compact"?"38px":s.dockSize==="large"?"55px":"46px";b.style.height=s.dockSize==="compact"?"40px":s.dockSize==="large"?"56px":"47px"})}
function open(section){s.active=section;save();dock();if(section==="home"){homeView();return}if(section==="settings"){settings();return}if(section==="bookmarks"){bookmarks();return}if(section==="workspaces"){workspaces();return}if(section==="notes"){notes();return}if(section==="games"){games();return}if(section==="downloads"){downloads();return}}
const snav=[["appearance","🎨","Appearance"],["search","⌕","Search"],["home","⌂","Home screen"],["widgets","▦","Widgets"],["privacy","🛡","Privacy & data"],["backup","↕","Backup & restore"],["about","ⓘ","About"]];
function row(label,desc,control){return '<div class="setting"><div><strong>'+label+'</strong><small>'+desc+'</small></div>'+control+'</div>'}
function sel(id,arr,val){return '<select id="'+id+'">'+arr.map(o=>'<option value="'+o[0]+'" '+(val===o[0]?"selected":"")+'>'+o[1]+'</option>').join("")+'</select>'}
function sw(id,on){return '<button class="switch '+(on?"on":"")+'" data-sw="'+id+'" aria-checked="'+on+'"></button>'}
function settings(which){settingTab=which||settingTab;let html='<div class="section-head"><div><h2>Settings</h2><p>Make BrowIO work the way you do.</p></div><button class="btn" id="settingsHome">← Home</button></div><div class="settingslayout"><nav class="sidenav" id="sidenav"></nav><section id="settingsbody"></section></div>';$("main").innerHTML=html;$("settingsHome").onclick=homeView;snav.forEach(([id,ic,n])=>{let b=document.createElement("button");b.className="navbtn"+(settingTab===id?" active":"");b.textContent=ic+" "+n;b.onclick=()=>settings(id);$("sidenav").append(b)});let c=$("settingsbody"),h="";
if(settingTab==="appearance")h='<div class="card group"><h3>Appearance</h3><p>Make your space feel like yours.</p>'+row("Theme","Choose a visual style.",sel("theme",[["dark","Midnight Glass"],["light","Cloud Light"],["aurora","Aurora"],["dream","Dreamscape"]],s.theme))+row("Accent color","Highlights and active controls.",'<input id="accent" type="color" value="'+s.accent+'">')+row("Taskbar size","Choose dock sizing.",sel("docksize",[["compact","Compact"],["standard","Standard"],["large","Large"]],s.dockSize))+row("Glass transparency","Adjust the taskbar opacity.",'<input id="trans" type="range" min="25" max="95" value="'+s.transparency+'">')+'</div><div class="card group"><h3>Wallpaper studio</h3><p>Choose a backdrop or upload your own image (up to 3 MB).</p><div class="walls">'+[["w1","Aurora"],["w2","Sunset"],["w3","Lagoon"],["w4","Cloud"],["w5","Midnight"],["w6","Golden hour"]].map(w=>'<button class="wall '+w[0]+' '+(s.wall===w[0]?"sel":"")+'" data-wall="'+w[0]+'" title="'+w[1]+'"></button>').join("")+'</div><p><button class="btn" id="uploadwall">＋ Upload wallpaper</button> <button class="btn" id="resetwall">Reset</button></p></div>';
else if(settingTab==="search")h='<div class="card group"><h3>Search engine</h3><p>Choose where search phrases are sent.</p>'+row("Default provider","Used by the home search and address bar.",sel("engine",[["google","Google"],["bing","Bing"],["duckduckgo","DuckDuckGo"]],s.search))+'</div><div class="status">Searches go online through your chosen provider, which applies its own privacy policy.</div>';
else if(settingTab==="home")h='<div class="card group"><h3>Home screen</h3><p>Adjust the dashboard.</p>'+row("Greeting","Show a time-based greeting.",sw("greeting",s.greeting))+row("24-hour clock","Use 24-hour time.",sw("clock24",s.clock24))+'</div><div class="card group"><h3>Shortcuts</h3><button class="btn primary" id="settingsaddfav">＋ Add shortcut</button></div>';
else if(settingTab==="widgets")h='<div class="card group"><h3>Dashboard widgets</h3><p>Hide or show widgets without deleting their data.</p>'+row("Clock and date","Show time and date.",sw("widget_clock",s.widgets.clock))+row("Weather shortcut","Show forecast search.",sw("widget_weather",s.widgets.weather))+row("Quick notes","Show notes shortcut.",sw("widget_notes",s.widgets.notes))+row("Recently visited","Show recent sites.",sw("widget_recent",s.widgets.recent))+row("Quick launch","Show favorite shortcuts.",sw("widget_favorites",s.widgets.favorites))+'</div>';
else if(settingTab==="privacy")h='<div class="card group"><h3>Privacy and data</h3><p>Manage information saved by BrowIO on this device.</p>'+row("Private session","New visits stay out of BrowIO history.",'<button class="btn" id="private">'+(privateMode?"End private mode":"Start private mode")+'</button>')+row("Browsing history",s.history.length+" saved visits",'<button class="btn" id="clearhistory">Clear history</button>')+row("Reset application data","Delete saved BrowIO preferences and user data.",'<button class="btn" id="resetdata">Reset data</button>')+'</div><div class="status">Private mode only changes BrowIO’s own history. It does not hide activity from websites, your network, or the host browser.</div>';
else if(settingTab==="backup")h='<div class="card group"><h3>Backup and restore</h3><p>Save a portable copy of your BrowIO data.</p>'+row("Export backup","Download settings, notes, bookmarks, and saves.",'<button class="btn primary" id="export">Export backup</button>')+row("Import backup","Validate a backup before restoring it.",'<button class="btn" id="import">Choose file</button>')+row("Last saved",new Date(s.lastSaved).toLocaleString(),'<span class="muted">On device</span>')+'</div><div class="status">Cloud sync is not active yet. Backups stay under your control.</div>';
else h='<div class="card group"><h3>About BrowIO</h3><div class="logo" style="width:54px;height:54px;font-size:27px">B</div><h2>BrowIO Web Edition</h2><p>Version 1.0 · Your web, your world.</p><div class="status">A single-file browser-style web application. It can search the web and display some sites, but it is not a standalone browser engine.</div></div>';
c.innerHTML=h;
const on=(id,ev,fn)=>{if($(id))$(id)[ev]=fn};
on("theme","change",e=>{s.theme=e.target.value;save();theme();settings("appearance")});on("accent","change",e=>{s.accent=e.target.value;save();theme()});on("docksize","change",e=>{s.dockSize=e.target.value;save();dock()});on("trans","input",e=>{s.transparency=+e.target.value;save();dock()});on("engine","change",e=>{s.search=e.target.value;save();toast("Search provider updated.")});on("uploadwall","click",()=>$("wallfile").click());on("resetwall","click",()=>{s.wall="w1";s.customWall="";save();theme();settings("appearance")});document.querySelectorAll("[data-wall]").forEach(b=>b.onclick=()=>{s.wall=b.dataset.wall;s.customWall="";save();theme();settings("appearance")});on("settingsaddfav","click",addFav);
document.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{let id=b.dataset.sw;if(id==="greeting")s.greeting=!s.greeting;else if(id==="clock24")s.clock24=!s.clock24;else if(id.startsWith("widget_"))s.widgets[id.slice(7)]=!s.widgets[id.slice(7)];save();settings(settingTab);theme()});
on("private","click",()=>{privateMode=!privateMode;tempHistory=[];toast(privateMode?"Private session started.":"Private session ended.");settings("privacy")});on("clearhistory","click",()=>confirmBox("Clear saved history?","This removes BrowIO’s locally saved visits.",()=>{s.history=[];save();settings("privacy")}));on("resetdata","click",()=>confirmBox("Reset all BrowIO data?","Your local notes, bookmarks, themes, and settings will be erased. Export a backup first if needed.",()=>{localStorage.removeItem(KEY);s=JSON.parse(JSON.stringify(defaults));theme();settings("privacy");toast("Local data reset.")}));on("export","click",exportBackup);on("import","click",()=>$("importfile").click())
}
function theme(){let ts={dark:["#10121d","rgba(25,28,43,.78)","rgba(35,39,57,.84)","#f5f6ff","#a8aec5"],light:["#edf0fa","rgba(255,255,255,.82)","rgba(236,239,250,.9)","#202438","#636b81"],aurora:["#101b1c","rgba(23,42,42,.84)","rgba(33,58,57,.9)","#f1fffb","#aac9c2"],dream:["#1b1528","rgba(42,31,59,.84)","rgba(58,43,77,.88)","#fff6ff","#d0bfdc"]},t=ts[s.theme]||ts.dark;["bg","panel","panel2","text","muted"].forEach((k,i)=>document.documentElement.style.setProperty("--"+k,t[i]));document.documentElement.style.setProperty("--accent",s.accent);let w={w1:"radial-gradient(ellipse at 20% 20%,#3d367c,transparent 40%),radial-gradient(ellipse at 85% 70%,#164d61,transparent 38%),linear-gradient(135deg,#151727,#10121d)",w2:"radial-gradient(ellipse at 80% 15%,#ffad82,transparent 38%),linear-gradient(135deg,#653c79,#171b40)",w3:"radial-gradient(ellipse at 25% 80%,#7fe7c2,transparent 45%),linear-gradient(140deg,#142f37,#172039)",w4:"linear-gradient(135deg,#e3d5ff,#9bb9f5)",w5:"linear-gradient(140deg,#10131c,#3b4154)",w6:"radial-gradient(ellipse at 50% 50%,#ffca75,transparent 45%),linear-gradient(130deg,#593c56,#151c37)"};document.body.style.background=s.customWall?"url('"+s.customWall+"') center/cover fixed":(w[s.wall]||w.w1);document.querySelector('meta[name="theme-color"]').content=t[0];dock()}
function bookmarks(){ $("main").innerHTML='<div class="section-head"><div><h2>Bookmarks</h2><p>Your saved places on the web.</p></div><button class="btn primary" id="addbm">＋ Add bookmark</button></div><div class="grid" id="bmlist"></div>';let g=$("bmlist");if(!s.bookmarks.length)g.innerHTML='<div class="card empty">☆<p>No bookmarks yet. Use the ☆ toolbar button while browsing.</p></div>';s.bookmarks.forEach((b,i)=>{let e=document.createElement("div");e.className="card tile";e.innerHTML='<span class="siteicon">☆</span><strong>'+esc(b.title)+'</strong><small>'+esc(b.url)+'</small><div><button class="btn primary" data-openbm="'+i+'">Open</button> <button class="btn" data-delbm="'+i+'">Remove</button></div>';g.append(e)});$("addbm").onclick=addBookmark;g.querySelectorAll("[data-openbm]").forEach(b=>b.onclick=()=>nav(s.bookmarks[+b.dataset.openbm].url));g.querySelectorAll("[data-delbm]").forEach(b=>b.onclick=()=>{s.bookmarks.splice(+b.dataset.delbm,1);save();bookmarks()})}
function addBookmark(){let t=current();let name=prompt("Bookmark name:",t&&t.url?t.title:"");if(!name)return;let raw=prompt("Website address:",t&&t.url?t.url:"https://");if(!raw)return;let u=urlFor(raw);if(/^https?:/i.test(u)){s.bookmarks.unshift({title:name.slice(0,80),url:u});save();toast("Bookmark saved.");if(s.active==="bookmarks")bookmarks()}}
function workspaces(){$("main").innerHTML='<div class="section-head"><div><h2>Workspaces</h2><p>Separate your projects and browsing goals.</p></div><button class="btn primary" id="newspace">＋ New workspace</button></div><div class="grid" id="spaces"></div><div class="status">Workspaces are organizational areas in BrowIO. They do not control native tabs in the browser hosting this app.</div>';let g=$("spaces");s.workspaces.forEach((w,i)=>{let e=document.createElement("article");e.className="card tile";e.innerHTML='<span class="siteicon">▦</span><strong>'+esc(w.name)+'</strong><small>'+(w.id===s.activeWorkspace?"Currently active":"Workspace")+'</small><div><button class="btn primary" data-space="'+i+'">'+(w.id===s.activeWorkspace?"Active":"Switch")+'</button> <button class="btn" data-ren="'+i+'">Rename</button></div>';g.append(e)});$("newspace").onclick=()=>{let name=prompt("Workspace name:");if(name){s.workspaces.push({id:Math.random().toString(36).slice(2),name:name.slice(0,35)});save();workspaces()}};g.querySelectorAll("[data-space]").forEach(b=>b.onclick=()=>{s.activeWorkspace=s.workspaces[+b.dataset.space].id;save();workspaces()});g.querySelectorAll("[data-ren]").forEach(b=>b.onclick=()=>{let w=s.workspaces[+b.dataset.ren],n=prompt("Rename workspace:",w.name);if(n){w.name=n.slice(0,35);save();workspaces()}})}
function notes(){$("main").innerHTML='<div class="section-head"><div><h2>Notes</h2><p>Your ideas save as you type.</p></div><button class="btn primary" id="newnote">＋ New note</button></div><div class="notegrid" id="notelist"></div>';let g=$("notelist");s.notes.forEach((n,i)=>{let e=document.createElement("article");e.className="card";e.innerHTML='<input class="note-title" data-title="'+i+'" value="'+esc(n.title)+'" maxlength="120" aria-label="Note title"><textarea class="notearea" data-body="'+i+'" aria-label="Note content">'+esc(n.body)+'</textarea><p><button class="btn" data-delnote="'+i+'">Delete note</button></p>';g.append(e)});if(!s.notes.length)g.innerHTML='<div class="card empty">No notes yet. Create one above.</div>';g.querySelectorAll("[data-title]").forEach(e=>e.oninput=()=>{s.notes[+e.dataset.title].title=e.value;save()});g.querySelectorAll("[data-body]").forEach(e=>e.oninput=()=>{s.notes[+e.dataset.body].body=e.value;save()});g.querySelectorAll("[data-delnote]").forEach(e=>e.onclick=()=>{s.notes.splice(+e.dataset.delnote,1);save();notes()});$("newnote").onclick=()=>{s.notes.unshift({id:Math.random().toString(36).slice(2),title:"New note",body:""});save();notes()}}
function games(){$("main").innerHTML='<div class="section-head"><div><h2>Mini-games</h2><p>Small breaks, right inside BrowIO.</p></div></div><div class="gamegrid"><article class="card game"><div class="emoji">🪙</div><strong>BrowIO Clicker</strong><p>Tap to collect coins and beat your personal best.</p><div class="muted">Coins: <b id="coins">'+s.games.coins+'</b> · Taps: <b id="taps">'+s.games.taps+'</b></div><button class="btn primary" id="tapcoin">Tap +1 coin</button></article><article class="card game"><div class="emoji">🔢</div><strong>Number Hunt</strong><p>Guess a hidden number from 1 to 20.</p><div class="muted" id="numberstatus">Start a round to play.</div><input class="field" id="guess" type="number" min="1" max="20" placeholder="1–20"><button class="btn" id="guessbtn">Guess</button><button class="btn primary" id="newround">New round</button></article><article class="card game"><div class="emoji">🧠</div><strong>Quick Math</strong><p>Solve an addition question and build a streak.</p><div id="question" class="muted">Start a question to play.</div><input class="field" id="answer" type="number" placeholder="Answer"><button class="btn" id="checkmath">Check</button><button class="btn primary" id="newmath">New question</button><div id="mathscore" class="muted">Score: 0</div></article></div>'; $("tapcoin").onclick=()=>{s.games.coins++;s.games.taps++;save();$("coins").textContent=s.games.coins;$("taps").textContent=s.games.taps};$("newround").onclick=()=>{target=1+Math.floor(Math.random()*20);attempts=0;$("numberstatus").textContent="Pick a number!";$("guess").value=""};$("guessbtn").onclick=()=>{let n=+$("guess").value;if(!target){toast("Start a new round first.");return}if(!Number.isInteger(n)||n<1||n>20){toast("Enter a whole number from 1 to 20.");return}attempts++;if(n===target){$("numberstatus").textContent="Correct in "+attempts+" guess(es)!";target=0}else $("numberstatus").textContent=n<target?"Too low — try higher.":"Too high — try lower."};function q(){mathA=1+Math.floor(Math.random()*30);mathB=1+Math.floor(Math.random()*30);$("question").textContent=mathA+" + "+mathB+" = ?";$("answer").value=""}$("newmath").onclick=q;$("checkmath").onclick=()=>{if(!mathA&&!mathB){toast("Start a question first.");return}if(+$("answer").value===mathA+mathB){mathScore++;$("mathscore").textContent="Score: "+mathScore+" — nice!";s.games.mathHigh=Math.max(s.games.mathHigh,mathScore);save();q()}else $("mathscore").textContent="Not quite. Try again."}}
function downloads(){$("main").innerHTML='<div class="section-head"><div><h2>Downloads</h2><p>BrowIO exports and saved files.</p></div><button class="btn primary" id="export2">Export backup</button></div><div class="status">A webpage cannot track every download initiated by the host browser. BrowIO tracks its own backup exports here.</div><div id="downloadlist" style="margin-top:12px"></div>';let g=$("downloadlist");if(!s.downloads.length)g.innerHTML='<div class="card empty">⇩<p>No BrowIO exports yet.</p></div>';s.downloads.forEach(d=>{let e=document.createElement("div");e.className="card";e.style.marginBottom="8px";e.innerHTML="<strong>📄 "+esc(d.name)+"</strong><p class='muted'>"+new Date(d.time).toLocaleString()+"</p>";g.append(e)});$("export2").onclick=exportBackup}
function exportBackup(){let data={app:"BrowIO",version:1,exportedAt:new Date().toISOString(),state:s};let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="BrowIO-backup-"+new Date().toISOString().slice(0,10)+".browio";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200);s.downloads.unshift({name:a.download,time:Date.now()});save();toast("Backup exported. Keep the file somewhere safe.");}
function importBackup(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let b=JSON.parse(r.result);if(b.app!=="BrowIO"||b.version!==1||!b.state)throw Error("Unsupported BrowIO backup.");if(!Array.isArray(b.state.notes)||!Array.isArray(b.state.favorites)||!Array.isArray(b.state.bookmarks)||!Array.isArray(b.state.workspaces))throw Error("Backup is missing required data.");if(!confirm("Restore this backup? Your current BrowIO data will be replaced."))return;s=Object.assign(JSON.parse(JSON.stringify(defaults)),b.state);save();theme();makeTab();homeView();toast("Backup restored.");}catch(e){toast("Import failed: "+e.message)}};r.readAsText(file)}
function confirmBox(title,desc,fn){let r=$("modalroot");r.innerHTML='<div class="modal glass"><h2>'+esc(title)+'</h2><p>'+esc(desc)+'</p><div class="actions"><button class="btn" id="cancelmodal">Cancel</button><button class="btn primary" id="confirmmodal">Continue</button></div></div>';r.onclick=e=>{if(e.target===r)r.innerHTML=""};$("cancelmodal").onclick=()=>r.innerHTML="";$("confirmmodal").onclick=()=>{r.innerHTML="";fn()}}
$("newtab").onclick=()=>makeTab();$("brand").onclick=homeView;$("home").onclick=homeView;$("topsettings").onclick=()=>open("settings");$("go").onclick=()=>nav($("address").value);$("address").onkeydown=e=>{if(e.key==="Enter")nav(e.target.value)};$("back").onclick=()=>{let t=current();if(t&&t.idx>0){t.idx--;t.url=t.hist[t.idx];t.title=title(t.url);pageView(t.url)}};$("forward").onclick=()=>{let t=current();if(t&&t.idx<t.hist.length-1){t.idx++;t.url=t.hist[t.idx];t.title=title(t.url);pageView(t.url)}};$("reload").onclick=()=>current().url?pageView(current().url):homeView();$("bookmark").onclick=addBookmark;
$("wallfile").onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>3*1024*1024){toast("Please choose an image under 3 MB.");e.target.value="";return}let r=new FileReader();r.onload=()=>{s.customWall=r.result;s.wall="custom";save();theme();toast("Wallpaper updated.")};r.readAsDataURL(f);e.target.value=""};$("importfile").onchange=e=>{importBackup(e.target.files[0]);e.target.value=""};
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="l"){e.preventDefault();$("address").focus();$("address").select()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="t"){e.preventDefault();makeTab()}if(e.key==="Escape")$("modalroot").innerHTML=""});
theme();makeTab();homeView();setInterval(()=>{let c=$("clock"),d=$("date");if(c)c.textContent=time();if(d)d.textContent=date()},15000);
})();</script></body></html>
